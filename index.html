<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Stok Barang - SID Retail</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked"></i> Stok & Data Barang
            </h1>
            <button onclick="openModal('add')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium shadow flex items-center gap-2 transition">
                <i class="fa-solid fa-plus"></i> Tambah Barang
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Bar Pencarian & Info -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari kode atau nama barang..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border-slate-300">
            </div>
            <button onclick="loadDataBarang()" class="w-full md:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium transition border border-slate-300 flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> Refresh Data
            </button>
        </div>

        <!-- Notification Alert -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-lg text-sm font-medium transition"></div>

        <!-- Tabel Barang -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm font-semibold uppercase tracking-wider">
                            <th class="py-3 px-4">Kode</th>
                            <th class="py-3 px-4">Nama Barang</th>
                            <th class="py-3 px-4 text-center">Stok Toko</th>
                            <th class="py-3 px-4">Harga Toko</th>
                            <th class="py-3 px-4 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100 text-slate-700 text-sm">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>Memuat data barang...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Kontrol Paginasi -->
            <div class="bg-slate-50 px-4 py-3 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="text-sm text-slate-600" id="pageInfo">
                    Menampilkan 0 data
                </div>
                <div class="flex items-center gap-2" id="paginationControls">
                    <!-- Navigasi Halaman -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form (Tambah / Edit Barang & Stok) -->
    <div id="itemModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-lg">Tambah Barang Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="barangForm" onsubmit="saveBarang(event)" class="p-6 space-y-4">
                <input type="hidden" id="isEdit" value="false">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kode Barang</label>
                    <input type="text" id="kodeBarang" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Barang</label>
                    <input type="text" id="namaBarang" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Stok Toko</label>
                        <input type="number" id="stokBarang" required min="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Harga Toko</label>
                        <input type="number" id="hargaToko" required min="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="15000">
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition">
                        Batal
                    </button>
                    <button type="submit" id="btnSubmit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_KEY = "2d8cd73b32a98b101b92772f81d3b0d81";
        const BASE_URL = `https://sidretail.id/api/${API_KEY}`;
        
        let allData = [];
        let filteredData = [];
        let currentPage = 1;
        const rowsPerPage = 50;

        // Helper untuk memanggil API dengan TRX ID unik
        async function queryApi(sqlQuery) {
            const uniqueId = Date.now() + Math.floor(Math.random() * 1000);
            const trxId = "TRX" + uniqueId;
            
            const targetUrl = `${BASE_URL}/${trxId}/${encodeURIComponent(sqlQuery)}`;
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;
            
            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP Error status: ${response.status}`);
                const data = await response.json();
                if (data.status === "error") console.error("Respon Error API SID Retail:", data.result);
                return data;
            } catch (error) {
                console.error("API Request Failed:", error);
                return { status: "error", result: "Gagal terhubung ke server API." };
            }
        }

        // 1. Ambil Data Barang & Stok menggunakan kolom `stok_toko`
        async function loadDataBarang() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-8 text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                        <p>Memuat data barang...</p>
                    </td>
                </tr>`;

            // Query menggunakan nama kolom resmi SID Retail: stok_toko
            let res = await queryApi("select kode,nama,stok_toko,harga_toko from barang");

            // Fallback jika `stok_toko` tidak ditemukan (misal menggunakan stok_gudang)
            if (res && res.status === "error" && res.result.includes("Unknown column")) {
                res = await queryApi("select kode,nama,stok_gudang,harga_toko from barang");
            }

            if (res && res.status === "success") {
                let rawData = res.data || [];
                allData = Array.isArray(rawData) ? rawData : Object.values(rawData);
                filteredData = [...allData];
                currentPage = 1;
                renderTable();
            } else {
                showAlert(res.result || "Gagal mengambil data dari database", "error");
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-red-500">Gagal memuat data: ${res.result || ''}</td></tr>`;
            }
        }

        // 2. Render Data Tabel & Paginasi (50 Data/Halaman)
        function renderTable() {
            const tbody = document.getElementById("tableBody");
            if (!filteredData || filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">Tidak ada data barang.</td></tr>`;
                document.getElementById("pageInfo").innerText = "Menampilkan 0 data";
                document.getElementById("paginationControls").innerHTML = "";
                return;
            }

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = Math.min(startIndex + rowsPerPage, filteredData.length);
            const pageData = filteredData.slice(startIndex, endIndex);

            tbody.innerHTML = pageData.map(item => {
                const kode = item.kode || item.kode_barang || '-';
                const nama = item.nama || item.nama_barang || '-';
                
                // Mendapatkan angka stok dari field yang tersedia
                const rawStok = item.stok_toko !== undefined ? item.stok_toko : (item.stok_gudang !== undefined ? item.stok_gudang : 0);
                const stok = Number(rawStok || 0);

                const rawHarga = item.harga_toko || item.harga || 0;
                const cleanHarga = Math.round(parseFloat(rawHarga) || 0);

                const stokBadge = stok <= 5 
                    ? `<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-semibold">${stok}</span>` 
                    : `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-full text-xs font-semibold">${stok}</span>`;

                return `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="py-3 px-4 font-mono text-indigo-600 font-semibold">${kode}</td>
                        <td class="py-3 px-4 font-medium">${nama}</td>
                        <td class="py-3 px-4 text-center">${stokBadge}</td>
                        <td class="py-3 px-4">Rp ${cleanHarga.toLocaleString('id-ID')}</td>
                        <td class="py-3 px-4 text-center">
                            <div class="flex justify-center gap-2">
                                <button onclick="openModal('edit', '${kode}', '${nama}', ${stok}, ${cleanHarga})" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-md font-medium text-xs transition flex items-center gap-1">
                                    <i class="fa-solid fa-pen-to-square"></i> Edit
                                </button>
                                <button onclick="hapusBarang('${kode}')" class="px-3 py-1 bg-red-100 hover:bg-red-200 text-red-700 rounded-md font-medium text-xs transition flex items-center gap-1">
                                    <i class="fa-solid fa-trash"></i> Hapus
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            updatePaginationControls(startIndex, endIndex);
        }

        // Render Tombol Paginasi
        function updatePaginationControls(startIndex, endIndex) {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            document.getElementById("pageInfo").innerText = `Menampilkan ${startIndex + 1} - ${endIndex} dari ${filteredData.length} data`;

            let controls = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-3 py-1 border rounded bg-slate-100 text-slate-400 cursor-not-allowed"' : 'class="px-3 py-1 border rounded bg-white hover:bg-slate-50 text-slate-700"'}>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <span class="text-sm font-medium px-2">Halaman ${currentPage} dari ${totalPages || 1}</span>
                <button onclick="changePage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled class="px-3 py-1 border rounded bg-slate-100 text-slate-400 cursor-not-allowed"' : 'class="px-3 py-1 border rounded bg-white hover:bg-slate-50 text-slate-700"'}>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            `;
            document.getElementById("paginationControls").innerHTML = controls;
        }

        function changePage(newPage) {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage);
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
            }
        }

        // 3. Simpan Data (Memperbarui nama, stok_toko, dan harga_toko)
        async function saveBarang(event) {
            event.preventDefault();
            
            const isEdit = document.getElementById("isEdit").value === "true";
            const kode = document.getElementById("kodeBarang").value.trim();
            const nama = document.getElementById("namaBarang").value.trim();
            const stok = document.getElementById("stokBarang").value.trim();
            const harga = document.getElementById("hargaToko").value.trim();

            let sqlQuery = "";
            if (isEdit) {
                sqlQuery = `update barang set nama="${nama}", stok_toko="${stok}", harga_toko="${harga}" where kode="${kode}"`;
            } else {
                sqlQuery = `insert into barang (kode, nama, stok_toko, harga_toko) values ("${kode}", "${nama}", "${stok}", "${harga}")`;
            }

            let res = await queryApi(sqlQuery);

            // Fallback ke kolom stok_gudang jika stok_toko gagal
            if (res && res.status === "error" && res.result.includes("Unknown column")) {
                if (isEdit) {
                    sqlQuery = `update barang set nama="${nama}", stok_gudang="${stok}", harga_toko="${harga}" where kode="${kode}"`;
                } else {
                    sqlQuery = `insert into barang (kode, nama, stok_gudang, harga_toko) values ("${kode}", "${nama}", "${stok}", "${harga}")`;
                }
                res = await queryApi(sqlQuery);
            }

            if (res && res.status === "success") {
                showAlert(`Barang & Stok berhasil ${isEdit ? 'diperbarui' : 'ditambahkan'}!`, "success");
                closeModal();
                loadDataBarang();
            } else {
                showAlert(res.result || "Gagal menyimpan data", "error");
            }
        }

        // 4. Hapus Data Barang
        async function hapusBarang(kode) {
            if (!confirm(`Apakah Anda yakin ingin menghapus barang dengan kode: ${kode}?`)) return;

            const res = await queryApi(`delete from barang where kode="${kode}"`);

            if (res && res.status === "success") {
                showAlert("Barang berhasil dihapus!", "success");
                loadDataBarang();
            } else {
                showAlert(res.result || "Gagal menghapus barang", "error");
            }
        }

        // Filter tabel pencarian lokal
        function filterTable() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            filteredData = allData.filter(item => {
                const kode = (item.kode || item.kode_barang || '').toLowerCase();
                const nama = (item.nama || item.nama_barang || '').toLowerCase();
                return kode.includes(query) || nama.includes(query);
            });
            currentPage = 1;
            renderTable();
        }

        // Kontrol Modal
        function openModal(mode, kode = '', nama = '', stok = 0, harga = '') {
            const modal = document.getElementById("itemModal");
            const modalTitle = document.getElementById("modalTitle");
            const kodeInput = document.getElementById("kodeBarang");

            document.getElementById("barangForm").reset();
            
            if (mode === 'edit') {
                modalTitle.innerText = "Edit Data Barang & Stok";
                document.getElementById("isEdit").value = "true";
                kodeInput.value = kode;
                kodeInput.readOnly = true; 
                kodeInput.classList.add("bg-slate-100", "cursor-not-allowed");
                document.getElementById("namaBarang").value = nama;
                document.getElementById("stokBarang").value = stok;
                document.getElementById("hargaToko").value = harga;
            } else {
                modalTitle.innerText = "Tambah Barang Baru";
                document.getElementById("isEdit").value = "false";
                kodeInput.readOnly = false;
                kodeInput.classList.remove("bg-slate-100", "cursor-not-allowed");
            }

            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeModal() {
            const modal = document.getElementById("itemModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        // Notifikasi Alert
        function showAlert(message, type = "success") {
            const alertBox = document.getElementById("alertBox");
            alertBox.innerText = message;
            alertBox.className = `mb-6 p-4 rounded-lg text-sm font-medium transition ${
                type === 'success' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-red-100 text-red-800 border border-red-200'
            }`;
            alertBox.classList.remove("hidden");

            setTimeout(() => {
                alertBox.classList.add("hidden");
            }, 4000);
        }

        document.addEventListener("DOMContentLoaded", loadDataBarang);
    </script>
</body>
</html>
